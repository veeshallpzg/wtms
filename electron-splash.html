<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #1a1a1a;
    color: #c0caf5;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    user-select: none;
    -webkit-user-select: none;
  }

  .logo {
    max-width: 160px;
    margin-bottom: 28px;
    opacity: 0.95;
  }

  .app-name {
    font-size: 16px;
    font-weight: 600;
    color: #c0caf5;
    margin-bottom: 6px;
    letter-spacing: 0.3px;
  }

  .tagline {
    font-size: 12px;
    color: #565f89;
    margin-bottom: 32px;
  }

  .spinner-track {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 3px solid #414868;
    border-top-color: #7aa2f7;
    animation: spin 0.75s linear infinite;
    margin-bottom: 16px;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .status {
    font-size: 12px;
    color: #565f89;
    letter-spacing: 0.5px;
  }

  .dots::after {
    content: '';
    animation: dots 1.5s steps(4, end) infinite;
  }
  @keyframes dots {
    0%   { content: ''; }
    25%  { content: '.'; }
    50%  { content: '..'; }
    75%  { content: '...'; }
    100% { content: ''; }
  }
</style>
</head>
<body>
  <img class="logo" src="./public/images/Logo_white.png" onerror="this.style.display='none'">
  <div class="app-name">Work Time Management System</div>
  <div class="tagline">by Lucid The Artistry</div>
  <div class="spinner-track"></div>
  <div class="status"><span id="status-text">Starting</span><span class="dots"></span></div>
</body>
</html>
