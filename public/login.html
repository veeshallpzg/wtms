<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WTMS - Login</title>
    <link rel="icon" type="image/png" href="/images/only.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #1a1a1a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        /* Subtle background pattern */
        body::before {
            content: '';
            position: absolute;
            inset: 0;
            background:
                radial-gradient(ellipse 80% 60% at 20% 10%, rgba(122,162,247,0.07) 0%, transparent 60%),
                radial-gradient(ellipse 60% 50% at 80% 90%, rgba(187,154,247,0.07) 0%, transparent 60%),
                radial-gradient(ellipse 40% 40% at 50% 50%, rgba(115,218,202,0.04) 0%, transparent 60%);
            pointer-events: none;
        }

        .login-wrapper {
            display: flex;
            width: 100%;
            max-width: 900px;
            min-height: 520px;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 25px 60px rgba(0,0,0,0.5);
            position: relative;
            z-index: 1;
        }

        /* Left decorative panel */
        .login-left {
            flex: 1;
            background: linear-gradient(145deg, #222222 0%, #2a2a2a 100%);
            border-right: 1px solid #383838;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
            position: relative;
            overflow: hidden;
        }

        .login-left::before {
            content: '';
            position: absolute;
            width: 300px; height: 300px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(122,162,247,0.12) 0%, transparent 70%);
            top: -80px; left: -80px;
        }

        .login-left::after {
            content: '';
            position: absolute;
            width: 200px; height: 200px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(187,154,247,0.10) 0%, transparent 70%);
            bottom: -40px; right: -40px;
        }

        .brand-logo {
            margin-bottom: 32px;
            position: relative;
            z-index: 1;
        }

        .brand-logo img {
            max-width: 160px;
            height: auto;
            filter: brightness(1.1);
        }

        .brand-title {
            font-size: 22px;
            font-weight: 700;
            color: #c0caf5;
            margin-bottom: 8px;
            text-align: center;
            position: relative;
            z-index: 1;
        }

        .brand-subtitle {
            font-size: 13px;
            color: #565f89;
            text-align: center;
            position: relative;
            z-index: 1;
            line-height: 1.5;
            max-width: 200px;
        }

        /* Feature dots */
        .feature-list {
            margin-top: 36px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 220px;
        }

        .feature-item {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #a9b1d6;
            font-size: 13px;
        }

        .feature-dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        /* Right form panel */
        .login-right {
            width: 380px;
            background: #222222;
            padding: 48px 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .login-heading {
            font-size: 26px;
            font-weight: 700;
            color: #c0caf5;
            margin-bottom: 6px;
        }

        .login-subheading {
            font-size: 13px;
            color: #565f89;
            margin-bottom: 36px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #a9b1d6;
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 0.3px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            width: 16px; height: 16px;
            color: #565f89;
            pointer-events: none;
        }

        .form-group input {
            width: 100%;
            padding: 11px 12px 11px 38px;
            background: #2a2a2a;
            border: 1px solid #383838;
            border-radius: 8px;
            font-size: 14px;
            color: #c0caf5;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-group input::placeholder {
            color: #383838;
        }

        .form-group input:focus {
            outline: none;
            border-color: #7aa2f7;
            box-shadow: 0 0 0 3px rgba(122,162,247,0.15);
        }

        /* Username split-input wrapper focus ring */
        .username-wrap:focus-within {
            border-color: #7aa2f7 !important;
            box-shadow: 0 0 0 3px rgba(122,162,247,0.15);
        }
        .username-wrap input:focus {
            border: none;
            box-shadow: none;
        }

        .btn-login {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #7aa2f7 0%, #bb9af7 100%);
            color: #1a1a1a;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.15s;
            letter-spacing: 0.3px;
            margin-top: 8px;
        }

        .btn-login:hover {
            opacity: 0.92;
            transform: translateY(-1px);
        }

        .btn-login:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .error {
            background: rgba(247,118,142,0.12);
            color: #f7768e;
            border: 1px solid rgba(247,118,142,0.3);
            padding: 10px 14px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 13px;
            display: none;
        }

        .divider {
            height: 1px;
            background: #383838;
            margin: 28px 0 20px;
        }

        .credentials-label {
            font-size: 11px;
            font-weight: 600;
            color: #565f89;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
        }

        .credential-row {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 0;
        }

        .cred-badge {
            font-size: 10px;
            font-weight: 700;
            padding: 2px 7px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            min-width: 58px;
            text-align: center;
        }

        .cred-admin { background: rgba(247,118,142,0.15); color: #f7768e; }
        .cred-manager { background: rgba(122,162,247,0.15); color: #7aa2f7; }
        .cred-member { background: rgba(158,206,106,0.15); color: #9ece6a; }

        .cred-email {
            font-size: 12px;
            color: #a9b1d6;
            font-family: 'Courier New', monospace;
        }

        @media (max-width: 640px) {
            .login-left { display: none; }
            .login-wrapper { max-width: 400px; }
            .login-right { width: 100%; }
        }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <!-- Left branding panel -->
        <div class="login-left">
            <div class="brand-logo">
                <img src="/images/Logo_white.png" alt="Lucid The Artistry">
            </div>
            <div class="brand-title">Work Time Management</div>
            <div class="brand-subtitle">Track time, manage projects and collaborate with your team</div>
            <div class="feature-list">
                <div class="feature-item">
                    <div class="feature-dot" style="background:#7aa2f7;"></div>
                    Project & Task Tracking
                </div>
                <div class="feature-item">
                    <div class="feature-dot" style="background:#73daca;"></div>
                    Real-time Timer
                </div>
                <div class="feature-item">
                    <div class="feature-dot" style="background:#9ece6a;"></div>
                    Review & Approval Workflow
                </div>
                <div class="feature-item">
                    <div class="feature-dot" style="background:#bb9af7;"></div>
                    Time Reports & Analytics
                </div>
            </div>
        </div>

        <!-- Right login form -->
        <div class="login-right">
            <div class="login-heading">Welcome back</div>
            <div class="login-subheading">Sign in to your account</div>

            <div class="error" id="error"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Username</label>
                    <div class="input-wrapper username-wrap" style="display:flex;align-items:stretch;border:1px solid #383838;border-radius:8px;overflow:hidden;background:#2a2a2a;">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="z-index:1;">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                            <circle cx="12" cy="7" r="4"/>
                        </svg>
                        <input type="text" id="email" name="email" required placeholder="john.smith" autocomplete="username"
                            style="flex:1;border:none;background:transparent;padding:11px 12px 11px 38px;font-size:14px;color:#c0caf5;outline:none;">
                        <span style="padding:0 12px;background:rgba(122,162,247,0.1);border-left:1px solid #383838;color:#7aa2f7;font-size:13px;white-space:nowrap;font-family:'Courier New',monospace;display:flex;align-items:center;user-select:none;flex-shrink:0;">@lucid.wtms</span>
                    </div>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                        </svg>
                        <input type="password" id="password" name="password" required placeholder="••••••••" autocomplete="current-password">
                    </div>
                </div>
                <button type="submit" class="btn-login" id="submitBtn">Sign In</button>
            </form>

        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const submitBtn = document.getElementById('submitBtn');
            const errorDiv = document.getElementById('error');

            submitBtn.disabled = true;
            submitBtn.textContent = 'Signing in...';
            errorDiv.style.display = 'none';

            try {
                const response = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await response.json();
                if (response.ok) {
                    window.location.href = data.redirect;
                } else {
                    errorDiv.textContent = data.error || 'Invalid credentials';
                    errorDiv.style.display = 'block';
                }
            } catch (err) {
                errorDiv.textContent = 'Connection error. Please try again.';
                errorDiv.style.display = 'block';
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Sign In';
            }
        });
    </script>
</body>
</html>
